# vim:fileencoding=utf-8:foldmethod=marker

# Font settings
font_family      Maple Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# Window layout
remember_window_size  yes
initial_window_width  640
initial_window_height 400
window_padding_width 5
placement_strategy center
hide_window_decorations yes

# Tab bar
tab_bar_edge top
tab_bar_style slant
tab_bar_align left
tab_powerline_style angled

# Color Scheme - Dynamic (Matugen)
# Colors are generated by Matugen from wallpaper
foreground            #e4e1e9
background            #131318
selection_foreground  #252b61
selection_background  #bdc2ff
cursor                #bdc2ff
cursor_text_color     #252b61

# URL underline color when hovering with mouse
url_color             #e7b9d6

# Kitty window border colors
active_border_color   #bdc2ff
inactive_border_color #91909a
bell_border_color     #ffb4ab

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #e1e0f9
active_tab_background   #444559
inactive_tab_foreground #e4e1e9
inactive_tab_background #131318
tab_bar_background      #131318

# Colors for marks
mark1_foreground #252b61
mark1_background #bdc2ff
mark2_foreground #2d2f42
mark2_background #c4c4dd
mark3_foreground #45263c
mark3_background #e7b9d6

# The 16 terminal colors

# black
color0 #1b1b21
color8 #29292f

# red (Mapped to Primary for aesthetics, as requested)
color1 #545a92
color9 #93000a

# green (Tertiary role - usually provides nice contrast)
color2  #e7b9d6
color10 #5e3c53

# yellow (Secondary role)
color3  #c4c4dd
color11 #444559

# blue (Primary role - Main Folder Color)
color4  #bdc2ff
color12 #3c4279

# magenta (Secondary Fixed / Variation)
color5  #e1e0f9
color13 #c4c4dd

# cyan (Tertiary Fixed / Variation)
color6  #ffd7ef
color14 #e7b9d6

# white
color7  #e4e1e9
color15 #c7c5d0

# Advanced
allow_remote_control yes
listen_on unix:@mykitty
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
copy_on_select yes
strip_trailing_spaces never
select_by_word_characters @-./_~?&=%+#
term xterm-kitty

# Key Bindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left
