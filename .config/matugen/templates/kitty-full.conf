# vim:fileencoding=utf-8:foldmethod=marker

# Font settings
font_family      Maple Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# Window layout
remember_window_size  yes
initial_window_width  640
initial_window_height 400
window_padding_width 5
placement_strategy center
hide_window_decorations yes

# Tab bar
tab_bar_edge top
tab_bar_style slant
tab_bar_align left
tab_powerline_style angled

# Color Scheme - Dynamic (Matugen)
# Colors are generated by Matugen from wallpaper
foreground            {{colors.on_surface.default.hex}}
background            {{colors.surface.default.hex}}
selection_foreground  {{colors.on_primary.default.hex}}
selection_background  {{colors.primary.default.hex}}
cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.on_primary.default.hex}}

# URL underline color when hovering with mouse
url_color             {{colors.tertiary.default.hex}}

# Kitty window border colors
active_border_color   {{colors.primary.default.hex}}
inactive_border_color {{colors.outline.default.hex}}
bell_border_color     {{colors.error.default.hex}}

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   {{colors.on_secondary_container.default.hex}}
active_tab_background   {{colors.secondary_container.default.hex}}
inactive_tab_foreground {{colors.on_surface.default.hex}}
inactive_tab_background {{colors.surface.default.hex}}
tab_bar_background      {{colors.surface.default.hex}}

# Colors for marks
mark1_foreground {{colors.on_primary.default.hex}}
mark1_background {{colors.primary.default.hex}}
mark2_foreground {{colors.on_secondary.default.hex}}
mark2_background {{colors.secondary.default.hex}}
mark3_foreground {{colors.on_tertiary.default.hex}}
mark3_background {{colors.tertiary.default.hex}}

# The 16 terminal colors

# black
color0 {{colors.surface_container_low.default.hex}}
color8 {{colors.surface_container_high.default.hex}}

# red (Mapped to Primary for aesthetics, as requested)
color1 {{colors.inverse_primary.default.hex}}
color9 {{colors.error_container.default.hex}}

# green (Tertiary role - usually provides nice contrast)
color2  {{colors.tertiary.default.hex}}
color10 {{colors.tertiary_container.default.hex}}

# yellow (Secondary role)
color3  {{colors.secondary.default.hex}}
color11 {{colors.secondary_container.default.hex}}

# blue (Primary role - Main Folder Color)
color4  {{colors.primary.default.hex}}
color12 {{colors.primary_container.default.hex}}

# magenta (Secondary Fixed / Variation)
color5  {{colors.secondary_fixed.default.hex}}
color13 {{colors.secondary_fixed_dim.default.hex}}

# cyan (Tertiary Fixed / Variation)
color6  {{colors.tertiary_fixed.default.hex}}
color14 {{colors.tertiary_fixed_dim.default.hex}}

# white
color7  {{colors.on_surface.default.hex}}
color15 {{colors.on_surface_variant.default.hex}}

# Advanced
allow_remote_control yes
listen_on unix:@mykitty
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
copy_on_select yes
strip_trailing_spaces never
select_by_word_characters @-./_~?&=%+#
term xterm-kitty

# Key Bindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left
